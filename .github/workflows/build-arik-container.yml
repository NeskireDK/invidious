name: Build ArikTube container

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install required APT packages
        run: sudo apt install -y libsqlite3-dev

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1.9.2
        with:
          crystal: 1.20.3

      - name: Cache Shards
        uses: actions/cache@v6
        with:
          path: |
            ./lib
            ./bin
          key: shards-${{ hashFiles('shard.lock') }}

      - name: Install Shards
        run: |
          if ! shards check; then
            shards install --skip-postinstall --skip-executables
          fi

      - name: Run tests
        run: crystal spec

      - name: Build
        run: crystal build --warnings all --error-on-warnings --error-trace src/invidious.cr

  spec-db:

    runs-on: ubuntu-latest

    name: "spec - database backed"

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: invidious
          POSTGRES_PASSWORD: invidious
          POSTGRES_DB: invidious_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install required APT packages
        run: sudo apt install -y libsqlite3-dev postgresql-client
        shell: bash

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1.9.2
        with:
          crystal: 1.20.3

      - name: Cache Shards
        uses: actions/cache@v6
        with:
          path: |
            ./lib
            ./bin
          key: shards-${{ hashFiles('shard.lock') }}

      - name: Install Shards
        run: |
          if ! shards check; then
            shards install --skip-postinstall --skip-executables
          fi

      # Only the tables the specs under spec_db/ touch. Loading the whole
      # schema would make this job a second place the schema is described.
      - name: Load the tables under test
        run: psql "$INVIDIOUS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f config/sql/arik_settings.sql
        env:
          INVIDIOUS_TEST_DATABASE_URL: postgres://invidious:invidious@localhost:5432/invidious_test

      - name: Run the database-backed specs
        run: crystal spec spec_db/
        env:
          INVIDIOUS_TEST_DATABASE_URL: postgres://invidious:invidious@localhost:5432/invidious_test

  build:
    needs: [test, spec-db]
    # Only master publishes :latest — production pulls that tag through
    # Watchtower. A pull request or a dispatch on a work branch runs the test
    # jobs alone, which type-checks it without shipping it.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/neskiredk/invidious
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            "release=1"
